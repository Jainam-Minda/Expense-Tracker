{% extends 'tracker/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card-custom">
            <h3 class="fw-bold text-danger mb-2">Remove expense?</h3>
            <p class="text-muted mb-4">Remove <strong>{{ expense.title }}</strong> (${{ expense.amount|floatformat:2 }}) recorded on {{ expense.date|date:"Y-m-d" }}? This cannot be undone.</p>
            <form method="POST" action="{% url 'expense_delete' expense.pk %}">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger px-3">Yes, remove expense</button>
                <a href="{% url 'dashboard' %}" class="btn btn-link text-secondary text-decoration-none ms-2">Cancel</a>
            </form>
        </div>
    </div>
</div>
{% endblock %}
