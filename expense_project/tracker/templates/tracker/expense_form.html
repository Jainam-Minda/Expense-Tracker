{% extends 'tracker/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card-custom">
            <h3 class="fw-bold mb-1">Add an expense</h3>
            <p class="text-muted mb-4">Enter expense details to record a transaction.</p>
            <form method="POST">
                {% csrf_token %}
                <div class="mb-3"><label class="form-label fw-semibold">Expense name</label>{{ form.title }}</div>
                <div class="mb-3"><label class="form-label fw-semibold">Amount ($)</label><div class="input-group"><span class="input-group-text">$</span>{{ form.amount }}</div></div>
                <div class="mb-3"><label class="form-label fw-semibold">Category</label>{{ form.category }}</div>
                <div class="mb-4"><label class="form-label fw-semibold">Expense date</label>{{ form.date }}</div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-navy">Save expense</button>
                    <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
